<html lang="en">
<head>
  <meta charset="UTF-8" />

</head>
<body>

  <div class="background-carousel">
    <div class="scrolling-images">
      <img src="images/page1.png" alt="Image 1">
      <img src="images/page2.png" alt="Image 2">
      <img src="images/page3.png" alt="Image 3">
      <img src="images/page4.png" alt="Image 4">
      <img src="images/page5.png" alt="Image 5">
      <!-- repeat for seamless scrolling -->
      <img src="images/page1.png" alt="Image 1">
      <img src="images/page2.png" alt="Image 2">
      <img src="images/page3.png" alt="Image 3">
      <img src="images/page4.png" alt="Image 4">
      <img src="images/page5.png" alt="Image 5">

   <body>

  <!-- Your existing header here -->

 <div class="form-wrapper">
    <form id="booking-form">
      <h2>Reservation Form</h2>

      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required />

      <label for="contact">Contact Number:</label>
      <input type="tel" id="contact" name="contact" pattern="[0-9]{11}" required placeholder="e.g. 09171234567" />

      <label for="email">Email Address:</label>
      <input type="email" id="email" name="email" required />

      <label for="datetime">Event Date and Time:</label>
      <input type="datetime-local" id="datetime" name="datetime" required />

      <label for="packages">Selected Packages:</label>      <select id="packages" name="packages" required>
        <option value="">-- Select a Package --</option>
        <option value="1">Package 1 - ₱10,999</option>
        <option value="2">Package 2 - ₱13,999</option>
        <option value="3">Package 3 - ₱16,999</option>
      </select>

      <label for="notes">Additional Notes:</label>
      <input type="text" id="notes" name="notes" />

      <button type="submit">Preview Booking</button>
    </form>
  </div>

  <!-- Receipt / Confirmation Preview -->
  <div id="receipt" class="form-wrapper" style="display:none;">
    <div class="receipt-box">
      <h2>Booking Preview</h2>
      <p><strong>Name:</strong> <span id="r-name"></span></p>
      <p><strong>Contact:</strong> <span id="r-contact"></span></p>
      <p><strong>Email:</strong> <span id="r-email"></span></p>
      <p><strong>Event Date & Time:</strong> <span id="r-datetime"></span></p>
      <p><strong>Package:</strong> <span id="r-package"></span></p>
      <p><strong>Notes:</strong> <span id="r-notes"></span></p>      <div class="receipt-buttons">
  <button type="button" onclick="editForm()">Edit Details</button>
  <button type="button" onclick="confirmBooking()">Confirm Booking</button>
  <button type="button" onclick="cancelBooking()" class="cancel">Cancel Booking</button>
</div>
</div>
</div>



  <!-- Modal Popup -->
<div id="popup-modal" class="modal" style="display:none;">
  <div class="modal-content">
    <p id="popup-message">Are you sure?</p>
    <div class="modal-buttons">
      <button id="popup-confirm">Yes</button>
      <button id="popup-cancel">No</button>
    </div>
  </div>
</div>
  <script>
    const form = document.getElementById("booking-form");
    const receipt = document.getElementById("receipt");

    // Load packages on page load
    document.addEventListener('DOMContentLoaded', function() {
      loadPackages();
      checkUserSession();
    });    // Check if user is logged in
    async function checkUserSession() {
      try {
        const response = await fetch('api/check_session.php');
        const data = await response.json();
        
        if (data.success && data.user) {
          // Update navigation to show user is logged in
          document.getElementById('login-link').style.display = 'none';
          document.getElementById('user-menu').style.display = 'block';
          document.getElementById('user-name').textContent = `Hi, ${data.user.first_name}!`;
          
          // Pre-fill form with user data
          if (data.user.first_name && data.user.last_name) {
            document.getElementById('name').value = `${data.user.first_name} ${data.user.last_name}`;
          }
          if (data.user.email) {
            document.getElementById('email').value = data.user.email;
          }
          if (data.user.phone) {
            document.getElementById('contact').value = data.user.phone;
          }
        } else {
          // Show login link if not logged in
          document.getElementById('login-link').style.display = 'block';
          document.getElementById('user-menu').style.display = 'none';
        }
      } catch (error) {
        console.error('Error checking session:', error);
        // Show login link on error
        document.getElementById('login-link').style.display = 'block';
        document.getElementById('user-menu').style.display = 'none';
      }
    }

    // Load packages from database
    async function loadPackages() {
      try {
        const response = await fetch('api/reservation.php?action=packages');
        const data = await response.json();
        
        if (data.success) {
          const packageSelect = document.getElementById('packages');
          packageSelect.innerHTML = '<option value="">-- Select a Package --</option>';
          
          data.packages.forEach(package => {
            const option = document.createElement('option');
            option.value = package.package_id;
            option.textContent = `${package.package_name} - ₱${parseFloat(package.price).toLocaleString()}`;
            packageSelect.appendChild(option);
          });
        }
      } catch (error) {
        console.error('Error loading packages:', error);
      }
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      // Fill in receipt preview
      document.getElementById("r-name").textContent = form.name.value;
      document.getElementById("r-contact").textContent = form.contact.value;
      document.getElementById("r-email").textContent = form.email.value;
      
      // Format datetime for display
      const eventDate = new Date(form.datetime.value);
      const formattedDate = eventDate.toLocaleDateString('en-US', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
      document.getElementById("r-datetime").textContent = formattedDate;
      
      document.getElementById("r-package").textContent = form.packages.options[form.packages.selectedIndex].text;
      document.getElementById("r-notes").textContent = form.notes.value || 'None';

      // Calculate and show pricing
      calculatePricing();

      // Toggle view
      form.style.display = "none";
      receipt.style.display = "flex";
    });

    async function calculatePricing() {
      const packageId = form.packages.value;
      if (!packageId) return;

      try {
        const response = await fetch('api/reservation.php?action=packages');
        const data = await response.json();
        
        if (data.success) {
          const selectedPackage = data.packages.find(p => p.package_id == packageId);
          if (selectedPackage) {
            const packagePrice = parseFloat(selectedPackage.price);
            const reservationFee = 2000;
            const transportFee = 2500; // Metro Manila
            const totalAmount = packagePrice + reservationFee + transportFee;

            // Add pricing breakdown to receipt
            let pricingHTML = `
              <div class="pricing-breakdown">
                <p><strong>Package Price:</strong> ₱${packagePrice.toLocaleString()}</p>
                <p><strong>Reservation Fee:</strong> ₱${reservationFee.toLocaleString()}</p>
                <p><strong>Transport Fee (Metro Manila):</strong> ₱${transportFee.toLocaleString()}</p>
                <hr>
                <p><strong>Total Amount:</strong> ₱${totalAmount.toLocaleString()}</p>
                <p class="note">*Reservation fee of ₱2,000 is non-refundable</p>
              </div>
            `;
            
            // Insert pricing after notes
            const notesElement = document.querySelector('#receipt .receipt-box p:last-of-type');
            notesElement.insertAdjacentHTML('afterend', pricingHTML);
          }
        }
      } catch (error) {
        console.error('Error calculating pricing:', error);
      }
    }

    function editForm() {
      // Clear any existing pricing breakdown
      const pricingDiv = document.querySelector('.pricing-breakdown');
      if (pricingDiv) {
        pricingDiv.remove();
      }
      
      form.style.display = "flex";
      receipt.style.display = "none";
    }
  let currentAction = "";

function showPopup(message, action) {
  currentAction = action;
  document.getElementById("popup-message").textContent = message;
  document.getElementById("popup-modal").style.display = "flex";
}

document.getElementById("popup-confirm").onclick = function () {
  document.getElementById("popup-modal").style.display = "none";

  if (currentAction === "confirm") {
    submitReservation();
  } else if (currentAction === "cancel") {
    form.reset();
    receipt.style.display = "none";
    form.style.display = "flex";
    
    // Clear any pricing breakdown
    const pricingDiv = document.querySelector('.pricing-breakdown');
    if (pricingDiv) {
      pricingDiv.remove();
    }
  }

  currentAction = "";
};

document.getElementById("popup-cancel").onclick = function () {
  document.getElementById("popup-modal").style.display = "none";
  currentAction = "";
};

function confirmBooking() {
  showPopup("Are you sure you want to confirm this booking?", "confirm");
}

function cancelBooking() {
  showPopup("Are you sure you want to cancel this booking? All data will be lost.", "cancel");
}

// Submit reservation to database
async function submitReservation() {
  try {
    const formData = {
      action: 'create',
      customer_name: form.name.value,
      contact_number: form.contact.value,
      email: form.email.value,
      event_datetime: form.datetime.value,
      package_id: parseInt(form.packages.value),
      additional_notes: form.notes.value || null
    };

    const response = await fetch('api/reservation.php', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(formData)
    });

    const data = await response.json();

    if (data.success) {
      alert("Booking confirmed successfully! Your reservation ID is: " + data.reservation_id);
      
      // Reset form and show success message
      form.reset();
      receipt.style.display = "none";
      form.style.display = "flex";
      
      // Clear pricing breakdown
      const pricingDiv = document.querySelector('.pricing-breakdown');
      if (pricingDiv) {
        pricingDiv.remove();
      }
      
      // Redirect to login page if user wants to track reservations
      if (confirm("Would you like to create an account to track your reservations?")) {
        window.location.href = "Login.html";
      }
    } else {
      alert("Error: " + data.message);
    }
  } catch (error) {
    console.error('Error submitting reservation:', error);
    alert("An error occurred while submitting your reservation. Please try again.");
  }
}

// Set minimum date to 3 days from now
document.addEventListener('DOMContentLoaded', function() {
  const datetimeInput = document.getElementById('datetime');
  const now = new Date();
  const minDate = new Date(now.getTime() + (3 * 24 * 60 * 60 * 1000)); // 3 days from now
  
  // Format date for datetime-local input
  const year = minDate.getFullYear();
  const month = String(minDate.getMonth() + 1).padStart(2, '0');
  const day = String(minDate.getDate()).padStart(2, '0');
  const hours = String(minDate.getHours()).padStart(2, '0');
  const minutes = String(minDate.getMinutes()).padStart(2, '0');
  
  const minDateTime = `${year}-${month}-${day}T${hours}:${minutes}`;
  datetimeInput.min = minDateTime;
});

    // Logout function
    async function logout() {
      try {
        const response = await fetch('api/logout.php', {
          method: 'POST'
        });
        const data = await response.json();
        
        if (data.success) {
          window.location.href = 'landing page.html';
        }
      } catch (error) {
        console.error('Error during logout:', error);
        // Force logout even if there's an error
        window.location.href = 'landing page.html';
      }    }

    // Mobile menu functionality
    document.addEventListener('DOMContentLoaded', function() {
      const mobileMenuBtn = document.querySelector('.mobile-menu-btn');
      const navLinks = document.querySelector('.nav-links');
      
      mobileMenuBtn.addEventListener('click', function() {
        navLinks.classList.toggle('active');
        mobileMenuBtn.classList.toggle('active');
      });

      // Close mobile menu when clicking on a nav link
      document.querySelectorAll('.nav-link').forEach(link => {
        link.addEventListener('click', function() {
          navLinks.classList.remove('active');
          mobileMenuBtn.classList.remove('active');
        });
      });

      // Close mobile menu when clicking outside
      document.addEventListener('click', function(event) {
        const isClickInsideNav = navLinks.contains(event.target);
        const isClickOnMenuBtn = mobileMenuBtn.contains(event.target);
        
        if (!isClickInsideNav && !isClickOnMenuBtn && navLinks.classList.contains('active')) {
          navLinks.classList.remove('active');
          mobileMenuBtn.classList.remove('active');
        }
      });
    });

</script>


</body>
